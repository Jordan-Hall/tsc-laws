name: tslaws
description: Flag and run each law proposal on a pull request, record /tslaws accept comments, and write tsc-laws.lock on merge. From a monorepo root it covers every project in one run.
inputs:
  mode:
    description: report | command | merge | verify
    required: true
  token:
    description: >-
      Token for the GitHub API. For merge and command, use the tslaws GitHub App's token so the bot's commits and
      comments are the app's. Leave it empty for a run with `--results-out` in `args`: that run executes the laws and
      must never hold a token.
    required: false
    default: ''
  working-directory:
    description: Where tslaws runs. A project's directory, or a monorepo root (a tslaws.json with "projects", or package.json/pnpm workspaces) to cover every project in one run.
    default: .
  args:
    description: >-
      Extra arguments for `tslaws github <mode>`. For report and merge, `--results-out <file>` runs the laws and writes
      their reports (a job with no token), and `--results <file>` acts on such a file without running a law (the job
      with the token). See docs/github.md.
    default: ''
  tslaws-root:
    description: >-
      The trusted checkout whose node_modules holds tslaws. tslaws is found from here by Node's own resolution, never
      from working-directory, so a pull request's files (a committed node_modules/.bin or .npmrc) are never executed.
    default: ${{ github.workspace }}
  package-manager:
    description: >-
      auto | npm | pnpm | yarn | bun. auto reads the lockfile in tslaws-root (bun.lock, pnpm-lock.yaml, yarn.lock,
      package-lock.json), then the "packageManager" field of its package.json, and falls back to npm.
    default: auto
  install:
    description: >-
      'true' (default) runs a frozen install in tslaws-root first (npm ci, pnpm install --frozen-lockfile, yarn install
      --immutable, bun install --frozen-lockfile), so the lockfile decides exactly what runs. Set 'false' when an earlier
      step already installed.
    default: 'true'
  pnpm-version:
    description: The pnpm version to set up, plain semver (x.y.z). Empty reads "packageManager" from the package.json in tslaws-root, then a pinned default; never from working-directory.
    default: ''
  bun-version:
    description: The Bun version to set up, plain semver (x.y.z). Empty reads "packageManager" from the package.json in tslaws-root, then a pinned default.
    default: ''
outputs:
  proposals:
    description: (report) how many proposals the pull request makes
    value: ${{ steps.run.outputs.proposals }}
  accepted:
    description: (merge) how many law changes were written to the lock
    value: ${{ steps.run.outputs.accepted }}
  package-manager:
    description: The package manager that was used
    value: ${{ steps.detect.outputs.manager }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        TSLAWS_ROOT: ${{ inputs.tslaws-root }}
        REQUESTED: ${{ inputs.package-manager }}
        HELPER: ${{ github.action_path }}/package-manager.mjs
      run: |
        manager="$(node "$HELPER" detect "$TSLAWS_ROOT" "$REQUESTED")"
        echo "manager=$manager" >> "$GITHUB_OUTPUT"
    # The version is always named here, from the input, the trusted tslaws-root's package.json, or a pinned default and
    # checked to be plain semver. The setup actions then never read the workspace's package.json, which a pull request
    # can change.
    - id: version
      if: inputs.install == 'true' && (steps.detect.outputs.manager == 'bun' || steps.detect.outputs.manager == 'pnpm')
      shell: bash
      env:
        TSLAWS_ROOT: ${{ inputs.tslaws-root }}
        MANAGER: ${{ steps.detect.outputs.manager }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
        BUN_VERSION: ${{ inputs.bun-version }}
        HELPER: ${{ github.action_path }}/package-manager.mjs
      run: |
        if [ "$MANAGER" = bun ]; then requested="$BUN_VERSION"; else requested="$PNPM_VERSION"; fi
        version="$(node "$HELPER" version "$MANAGER" "$TSLAWS_ROOT" "$requested")"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    # Set up only the tool that is needed. Pinned to the commit of the release, so a moved tag cannot change what runs.
    - if: steps.detect.outputs.manager == 'bun' && inputs.install == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.version.outputs.version }}
    - if: steps.detect.outputs.manager == 'pnpm' && inputs.install == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ steps.version.outputs.version }}
        package_json_file: ${{ inputs.tslaws-root }}/package.json
    - if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.tslaws-root }}
      env:
        MANAGER: ${{ steps.detect.outputs.manager }}
        HELPER: ${{ github.action_path }}/package-manager.mjs
      run: node "$HELPER" install "$MANAGER" .
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        MODE: ${{ inputs.mode }}
        ARGS: ${{ inputs.args }}
        TSLAWS_ROOT: ${{ inputs.tslaws-root }}
        HELPER: ${{ github.action_path }}/package-manager.mjs
      run: |
        case "$MODE" in report|command|merge|verify) ;; *) echo "::error::unknown mode $MODE"; exit 1;; esac
        # Resolved from the trusted root, the way Node finds a package: it works for hoisted, nested and pnpm layouts.
        bin="$(node "$HELPER" bin "$TSLAWS_ROOT")" || { echo "::error::tslaws is not installed in $TSLAWS_ROOT"; exit 1; }
        # shellcheck disable=SC2086
        node "$bin" github "$MODE" $ARGS
