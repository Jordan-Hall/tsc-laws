name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: checks
            run: |
              npm run format:check
              npm run lint
              npx turbo run test --filter=@tsc-ts/relater --filter=@tsc-ts/tsgo
              npm run test:corpus
          - name: tsc-ts program 1/2
            run: npx turbo run build build:oracle && PROGRAM_SHARD=1/2 npm exec -w tsc-ts -- node --test tests/program.test.mjs
          - name: tsc-ts program 2/2
            run: npx turbo run build build:oracle && PROGRAM_SHARD=2/2 npm exec -w tsc-ts -- node --test tests/program.test.mjs
          - name: tsc-ts command line
            run: npx turbo run build build:oracle && npm exec -w tsc-ts -- node --test tests/command-line.test.mjs
          - name: tsc-ts
            run: |
              npx turbo run build build:oracle
              cd packages/tsc-ts
              node --test $(ls tests/*.test.mjs | grep -v -e program.test -e command-line.test)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            packages/gots/go.sum
            packages/tsc-ts/tests/xxh3-vectors/go.sum

      - uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}

      - run: npm ci
      - run: npm run fetch:upstream
      - run: ${{ matrix.run }}
