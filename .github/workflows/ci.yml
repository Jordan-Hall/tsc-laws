name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            packages/gots/go.sum
            packages/tsc-ts/tests/xxh3-vectors/go.sum

      - uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}

      - run: npm ci
      - run: npm run fetch:upstream
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:corpus
