name: CI

# Pull requests run lint, format, the build and the tests their changes select (scripts/ci/select-tests.mjs).
# Pushes to main and manual runs run every test. Releases require a green run for the push of the released commit
# (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run. Runs for main each finish.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      shards: ${{ steps.select.outputs.shards }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/ci/select-tests.mjs --base "$BASE" --head "$HEAD" --github-output
          else
            node scripts/ci/select-tests.mjs --full --github-output
          fi

  checks:
    name: lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            packages/gots/go.sum
            packages/tsc-ts/tests/xxh3-vectors/go.sum
      - uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      # Turbo's local cache. The oracles only change with these inputs, so their builds are restored from here.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-oracles-${{ hashFiles('upstream.json', 'packages/tsgo/oracles/**', 'packages/tsgo/checkhost/**', 'packages/*/scripts/build-oracle.mjs', 'packages/relater/oracle/**') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - run: npx turbo run build build:oracle --filter='!@tsc-ts/web'
      - run: node scripts/ci/compile-tests.mjs packages/tsc-ts/dist/test-build
      # A tar keeps the executable bits that artifacts drop.
      - run: tar -cf build.tar packages/tsc-ts/dist packages/tsgo/dist packages/relater/dist
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar
          retention-days: 3
          compression-level: 1

  test:
    name: test ${{ matrix.shard }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xf build.tar && rm build.tar
      - name: Run tests
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          TSC_TS_TEST_BUILD: ${{ github.workspace }}/packages/tsc-ts/dist/test-build
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node scripts/ci/run-tests.mjs --plan "$RUNNER_TEMP/plan.json" --shard ${{ matrix.shard }} --report "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          retention-days: 30

  docs:
    name: documentation
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check -w @tsc-ts/web
      - run: npm test -w @tsc-ts/web
      - run: npm run check:examples -w @tsc-ts/web
      - run: npm run build:web
      - run: npm run test:routes -w @tsc-ts/web

  # The one check branch protection needs: it fails when any job above failed or was cancelled.
  result:
    name: CI result
    needs: [plan, checks, build, test, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -q -e failure -e cancelled; then exit 1; fi
