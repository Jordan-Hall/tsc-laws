name: certificates

# Runs every proof tool tslaws can use, the real ones: cvc5 writes an Alethe proof of an `unsat` query and Carcara checks
# it (straight-line laws and the invariants of loops alike), and Eldarica and Golem confirm the loop invariants Z3 finds.
# The tools are pinned (by release and sha256, or by commit), so a change in their options or output shows up here and not
# in a user's CI. The job ends by holding tslaws to its own laws with all of them present.
on:
  push:
    branches: [main, laws]
  pull_request:
    paths:
      - 'packages/tslaws/src/certificates.ts'
      - 'packages/tslaws/src/solvers.ts'
      - 'packages/tslaws/src/smt.ts'
      - 'packages/tslaws/src/lock.ts'
      - 'packages/tslaws/src/check.ts'
      - 'packages/tslaws/src/chc.ts'
      - 'packages/tslaws/laws/**'
      - 'packages/tslaws/test/certificates.test.ts'
      - 'packages/tslaws/test/certificates.problems.json'
      - 'packages/tslaws/test/chc.test.ts'
      - '.github/actions/proof-tools/**'
      - 'scripts/ci/certificates-*'
      - 'scripts/ci/certificates-*/**'
      - '.github/workflows/certificates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificates:
    name: cvc5, Carcara, Eldarica and Golem
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      # cvc5, Carcara, Eldarica and Golem, pinned; the action sets the TSLAWS_* variables the steps below use.
      - uses: ./.github/actions/proof-tools
      - run: npm ci --ignore-scripts
      - run: npm run build -w tslaws
      # The same sample problems the test certifies, with the tools' full output, to see why a certificate fails.
      - name: Try the tools by hand
        if: always()
        run: node scripts/ci/certificates-smoke.mjs
      - name: Certify and cross-check with the real tools
        working-directory: packages/tslaws
        env:
          TSLAWS_REQUIRE_CERT_TOOLS: '1'
        run: node --test test/certificates.test.ts test/chc.test.ts
      # A certified check, end to end, with the real tools: check, accept (the lock keeps the certificates), check, and check with
      # certificates required. It prints what the report and the lock look like. `accept` needs a terminal and refuses CI,
      # so it runs under `script` (a pseudo-terminal) with the CI variable removed; nothing else changes.
      - name: Show a certified check and accept
        if: always()
        working-directory: scripts/ci/certificates-demo
        run: |
          tslaws() { node "$GITHUB_WORKSPACE/packages/tslaws/bin/tslaws.js" "$@"; }
          export -f tslaws
          export GITHUB_WORKSPACE
          rm -rf tsc-laws.lock .tslaws
          tslaws check > /dev/null || true  # leaves the certificates for accept to verify and copy
          echo '--- tslaws accept'
          printf 'accept\n' | env -u CI script -qec 'bash -c "tslaws accept"' /dev/null
          echo '--- tslaws check'
          tslaws check
          echo '--- tslaws check --require-certify'
          status=0
          tslaws check --require-certify || status=$?
          echo "exit status $status"
          echo '--- tsc-laws.lock'
          cat tsc-laws.lock
      # The loops are certified too: Z3 finds the invariant, cvc5 refutes the clauses with it put in, Carcara checks that.
      - name: The loop laws are certified
        working-directory: scripts/ci/certificates-demo
        run: |
          node "$GITHUB_WORKSPACE/packages/tslaws/bin/tslaws.js" check > loops.txt || true
          cat loops.txt
          for name in 'counting up reaches n' 'the largest is never negative'; do
            grep -A3 "PROVED   $name" loops.txt | grep -q 'certificate: certified'               || { echo "::error::the loop law '$name' is not certified"; exit 1; }
          done
      # tslaws held to its own laws with every tool present: the proofs are certified and the loop invariants cross-checked by
      # the other solvers. Nothing here may fail or be tampered with.
      - name: tslaws checks its own laws
        working-directory: packages/tslaws
        run: node bin/tslaws.js check laws/core.laws.ts --certify --summary
