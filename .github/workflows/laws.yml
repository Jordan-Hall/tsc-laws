name: tsc-laws

# Tests the law syntax and the `tslaws` runner against a native build of the compiler on every push and pull request.
# A `laws-v*` tag also builds the compiler for each platform and publishes a GitHub release with those builds and the
# `tslaws` package.
on:
  push:
    branches: [main, laws]
    tags: ['laws-v*']
  pull_request:
    paths:
      - 'packages/tsc-ts/**'
      - 'packages/tslaws/**'
      - 'packages/vscode-tslaws/**'
      - '.github/workflows/laws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: vercel-labs/setup-zig@v1
        if: runner.os == 'Windows'
        with:
          version: 0.16.0
      - run: npm ci
      - run: npm run fetch:upstream
      - run: npm run build:native -w tsc-ts
      - name: Name the Windows build tsc.exe
        if: runner.os == 'Windows'
        run: cp packages/tsc-ts/dist/tsc packages/tsc-ts/dist/tsc.exe
        shell: bash
      - run: npm run build -w tslaws
      - name: Compiler tests for law
        run: node --test packages/tsc-ts/tests/laws.test.mjs
        env:
          TSC_TS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}
      - name: tslaws tests
        run: npm test -w tslaws
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}
      - name: VS Code extension tests
        run: npm test -w vscode-tslaws
      - name: Package the VS Code extension
        if: runner.os == 'Linux'
        working-directory: packages/vscode-tslaws
        run: |
          cp ../../LICENSE LICENSE
          npx --yes @vscode/vsce package --no-dependencies --out tslaws-vscode.vsix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vscode-tslaws
          path: packages/vscode-tslaws/tslaws-vscode.vsix
          if-no-files-found: error
      - name: All examples, from source
        if: runner.os == 'Linux'
        shell: bash
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/tsc
        run: |
          # The examples are workspace members, so `tslaws` there is packages/tslaws, and the compiler is the one built above.
          for example in react angular vanilla-ts vanilla-js e2e checkout; do
            echo "::group::examples/$example"
            (cd "examples/$example" && node ../../packages/tslaws/bin/tslaws.js check --summary)
            echo "::endgroup::"
          done
      - name: Example project
        working-directory: examples/basic
        # sortKeepsLength fails on purpose; the other laws must hold.
        run: |
          node ../../packages/tslaws/bin/tslaws.js check --summary > out.txt || true
          cat out.txt
          grep -q "1 failed" out.txt
        shell: bash
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}

  build:
    name: build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.34 }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, target: x86_64-linux-gnu.2.34 }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: vercel-labs/setup-zig@v1
        if: matrix.platform == 'win32-x64-msvc' || matrix.target
        with:
          version: 0.16.0
      - name: Build and pack the compiler
        env:
          SCRIPTC_TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm run fetch:upstream
          npm run pack:npm -w tsc-ts -- platform
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: tsc-laws-${{ matrix.platform }}
          path: packages/tsc-ts/dist/npm/tsc-ts-${{ matrix.platform }}-*.tgz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w tslaws
      - run: mkdir -p release && npm pack -w tslaws --pack-destination release
      - uses: actions/download-artifact@v4
        with:
          pattern: tsc-laws-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vscode-tslaws
          path: release
      - name: The VS Code extension matches the tag
        run: |
          version="${GITHUB_REF_NAME#laws-v}"
          extension=$(node -p "require('./packages/vscode-tslaws/package.json').version")
          if [ "$version" != "$extension" ]; then
            echo "::error::vscode-tslaws is $extension but the tag is $version"; exit 1
          fi
          mv release/tslaws-vscode.vsix "release/tslaws-vscode-$version.vsix"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes

  # Publishes to npm on a release tag, using the repository secret NPM_TOKEN (Settings > Secrets and variables > Actions),
  # or npm trusted publishing if you set that up instead. See RELEASING-LAWS.md.
  npm:
    name: npm
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w tslaws
      - uses: actions/download-artifact@v4
        with:
          pattern: tsc-laws-*
          path: platform
          merge-multiple: true
      - name: Repack the compilers as tslaws-compiler-<platform>
        run: |
          node scripts/ci/laws-npm.mjs compilers platform compilers
          node scripts/ci/laws-npm.mjs main compilers
          cp LICENSE packages/tslaws/LICENSE
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc; fi
          # The compilers first, so tslaws never points at a package that is not there yet.
          # "./" matters: npm reads a bare "compilers/x.tgz" as the GitHub repository compilers/x.tgz.
          for package in ./compilers/*.tgz; do
            npm publish "$package" --access public --provenance --registry https://registry.npmjs.org
          done
          npm publish ./packages/tslaws --access public --provenance --registry https://registry.npmjs.org

  # Publishes the extension to the VS Code Marketplace and Open VSX when the repository variable VSCODE_PUBLISH is 'true'
  # and the matching secret exists: VSCE_PAT (Marketplace) and/or OVSX_PAT (Open VSX). See RELEASING-LAWS.md.
  marketplace:
    name: marketplace
    if: startsWith(github.ref, 'refs/tags/laws-v') && vars.VSCODE_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: vscode-tslaws
          path: vsix
      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$VSCE_PAT$OVSX_PAT" ] || { echo "::error::set VSCE_PAT and/or OVSX_PAT"; exit 1; }
          if [ -n "$VSCE_PAT" ]; then npx --yes @vscode/vsce publish --packagePath vsix/tslaws-vscode.vsix; fi
          if [ -n "$OVSX_PAT" ]; then npx --yes ovsx publish vsix/tslaws-vscode.vsix -p "$OVSX_PAT"; fi
