name: tsc-laws

# Tests the law syntax and the `tslaws` runner against a native build of the compiler on every push and pull request.
# A `laws-v*` tag also builds the compiler for each platform and publishes a GitHub release with those builds and the
# `tslaws` package.
on:
  push:
    branches: [main, laws]
    tags: ['laws-v*']
  pull_request:
    paths:
      - 'packages/tsc-ts/**'
      - 'packages/tslaws/**'
      - 'packages/vscode-tslaws/**'
      - '.github/workflows/laws.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        if: runner.os == 'Windows'
        with:
          version: 0.16.0
      - run: npm ci
      - run: npm run fetch:upstream
      - run: npm run build:native -w tsc-ts
      - name: Name the Windows build tsc.exe
        if: runner.os == 'Windows'
        run: cp packages/tsc-ts/dist/tsc packages/tsc-ts/dist/tsc.exe
        shell: bash
      - run: npm run build -w tslaws
      - name: Compiler tests for law
        run: node --test packages/tsc-ts/tests/laws.test.mjs
        env:
          TSC_TS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}
      - name: tslaws tests
        run: npm test -w tslaws
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}
      - name: VS Code extension tests
        run: npm test -w vscode-tslaws
      - name: Package the VS Code extension
        if: runner.os == 'Linux'
        working-directory: packages/vscode-tslaws
        run: |
          cp ../../LICENSE LICENSE
          npx --yes @vscode/vsce package --no-dependencies --out tslaws-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.os == 'Linux'
        with:
          name: vscode-tslaws
          path: packages/vscode-tslaws/tslaws-vscode.vsix
          if-no-files-found: error
      - name: All examples, from source
        if: runner.os == 'Linux'
        shell: bash
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/tsc
        run: |
          # The examples are workspace members, so `tslaws` there is packages/tslaws, and the compiler is the one built above.
          for example in react angular vanilla-ts vanilla-js e2e checkout; do
            echo "::group::examples/$example"
            (cd "examples/$example" && node ../../packages/tslaws/bin/tslaws.js check --summary)
            echo "::endgroup::"
          done
      - name: Example project
        working-directory: examples/basic
        # sortKeepsLength fails on purpose; the other laws must hold.
        run: |
          node ../../packages/tslaws/bin/tslaws.js check --summary > out.txt || true
          cat out.txt
          grep -q "1 failed" out.txt
        shell: bash
        env:
          TSC_LAWS_BIN: ${{ github.workspace }}/packages/tsc-ts/dist/${{ runner.os == 'Windows' && 'tsc.exe' || 'tsc' }}

  # The tag jobs below (build, release, npm) publish, so they install without the shared npm cache.
  build:
    name: build ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.34 }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, target: x86_64-linux-gnu.2.34 }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        if: matrix.platform == 'win32-x64-msvc' || matrix.target
        with:
          version: 0.16.0
      - name: Build and pack the compiler
        env:
          SCRIPTC_TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm run fetch:upstream
          npm run pack:npm -w tsc-ts -- platform
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tsc-laws-${{ matrix.platform }}
          path: packages/tsc-ts/dist/npm/tsc-ts-${{ matrix.platform }}-*.tgz
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # A laws-v* tag on a commit outside main must not publish a GitHub release either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main. Tag a commit on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w tslaws
      - run: mkdir -p release && npm pack -w tslaws --pack-destination release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tsc-laws-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vscode-tslaws
          path: release
      - name: tslaws matches the tag
        run: |
          version="${GITHUB_REF_NAME#laws-v}"
          package=$(node -p "require('./packages/tslaws/package.json').version")
          if [ "$version" != "$package" ]; then
            echo "::error::tslaws is $package but the tag is $version"; exit 1
          fi
      - name: The VS Code extension matches the tag
        run: |
          version="${GITHUB_REF_NAME#laws-v}"
          extension=$(node -p "require('./packages/vscode-tslaws/package.json').version")
          if [ "$version" != "$extension" ]; then
            echo "::error::vscode-tslaws is $extension but the tag is $version"; exit 1
          fi
          mv release/tslaws-vscode.vsix "release/tslaws-vscode-$version.vsix"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from this version's CHANGELOG-LAWS.md section; a hand-made tag without one falls back to generated notes.
          rm -f release-notes.md
          node scripts/ci/laws-auto-release.mjs notes "${GITHUB_REF_NAME#laws-v}" release-notes.md
          if [ -s release-notes.md ]; then notes=(--notes-file release-notes.md); else notes=(--generate-notes); fi
          # release-please creates the release when its pull request merges; a tag made by hand has none yet.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
            if [ -s release-notes.md ]; then gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md; fi
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" "${notes[@]}"
          fi

  # Publishes to npm on a release tag with npm trusted publishing: npm trusts this workflow through GitHub OIDC
  # (id-token: write), so no npm token is stored. See RELEASING-LAWS.md.
  npm:
    name: npm
    if: startsWith(github.ref, 'refs/tags/laws-v')
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish only commits that are on main: a laws-v* tag on any other commit stops here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main. Tag a commit on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run build -w tslaws
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tsc-laws-*
          path: platform
          merge-multiple: true
      - name: Repack the compilers as tslaws-compiler-<platform>
        run: |
          node scripts/ci/laws-npm.mjs compilers platform compilers
          node scripts/ci/laws-npm.mjs main compilers
          cp LICENSE packages/tslaws/LICENSE
      - name: Publish
        run: |
          # The compilers first, so tslaws never points at a package that is not there yet.
          # "./" matters: npm reads a bare "compilers/x.tgz" as the GitHub repository compilers/x.tgz.
          for package in ./compilers/*.tgz; do
            npm publish "$package" --access public --provenance --registry https://registry.npmjs.org
          done
          npm publish ./packages/tslaws --access public --provenance --registry https://registry.npmjs.org

  # Publishes the extension to the VS Code Marketplace and Open VSX when the repository variable VSCODE_PUBLISH is 'true'
  # and, for the Marketplace, optionally the VSCE_PAT secret. Open VSX uses trusted publishing (OIDC). See RELEASING-LAWS.md.
  marketplace:
    name: marketplace
    if: startsWith(github.ref, 'refs/tags/laws-v') && vars.VSCODE_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Publish only commits that are on main: a laws-v* tag on any other commit stops here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main. Tag a commit on main."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vscode-tslaws
          path: vsix
      - name: Describe the package
        id: pkg
        run: |
          version="${GITHUB_REF_NAME#laws-v}"
          flag=""
          case "$version" in *-*) flag="--pre-release" ;; esac
          echo "flag=$flag" >> "$GITHUB_OUTPUT"
          sha="$(sha256sum vsix/tslaws-vscode.vsix | cut -d' ' -f1)"
          {
            echo "### VS Code extension $version"
            echo "- .vsix SHA-256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the Visual Studio Marketplace
        id: vsce
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # A PAT is an explicit fallback: use it when present, trusted publishing (OIDC) otherwise.
          auth="--oidc"
          if [ -n "$VSCE_PAT" ]; then auth=""; fi
          if npx --yes @vscode/vsce@4.1.0 publish $auth --packagePath vsix/tslaws-vscode.vsix --skip-duplicate ${{ steps.pkg.outputs.flag }} > store.log 2>&1; then
            if grep -qi "already exists" store.log; then
              echo "::notice::Visual Studio Marketplace already has this version; nothing to do"
              echo "- Visual Studio Marketplace: already published" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Visual Studio Marketplace: published" >> "$GITHUB_STEP_SUMMARY"
            fi
          elif grep -qi "already exists" store.log; then
            echo "::notice::Visual Studio Marketplace already has this version; nothing to do"
            echo "- Visual Studio Marketplace: already published" >> "$GITHUB_STEP_SUMMARY"
          else
            cat store.log
            echo "- Visual Studio Marketplace: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publish to Open VSX
        id: ovsx
        continue-on-error: true
        run: |
          # Trusted publishing (OIDC): the registry exchanges the job's GitHub ID token for a short-lived publish token.
          # No access token is stored or read; --trusted-publishing fails the publish if no ID token can be obtained.
          if npx --yes ovsx@1.3.0 publish vsix/tslaws-vscode.vsix ${{ steps.pkg.outputs.flag }} --trusted-publishing > store.log 2>&1; then
            echo "- Open VSX: published" >> "$GITHUB_STEP_SUMMARY"
          elif grep -qi "already exists" store.log; then
            echo "::notice::Open VSX already has this version; nothing to do"
            echo "- Open VSX: already published" >> "$GITHUB_STEP_SUMMARY"
          else
            cat store.log
            if grep -qiE "not verified|unverified|not (the )?owner|not a member|namespace.*(owner|verif)|owner.*namespace" store.log; then
              echo "::error::Open VSX refused the publish because the ts-laws namespace (the casing must match exactly) is not verified for this account. Sign in at https://open-vsx.org, open the namespace page and click Claim Ownership, then wait for the Open VSX team to approve it. See docs/publishing-the-extension.md."
            elif grep -qiE "trusted publisher|trusted publishing|oidc|id token" store.log; then
              echo "::error::Open VSX answered that no trusted publisher matches. The registry gives this one message for every mismatch, so check in order. (1) First publish: a trusted publisher can only be registered once the extension has an active version, so publish the first version with an access token (run ovsx publish by hand with an access token typed in your own terminal), then register the trusted publisher. (2) The Open VSX namespace must be exactly ts-laws, the publisher in packages/vscode-tslaws/package.json; the check is case-sensitive. (3) The trusted publisher fields: provider GitHub Actions, repository owner Jordan-Hall, repository tsc-laws, workflow laws.yml, environment empty or release. See the Open VSX section of docs/publishing-the-extension.md."
            fi
            echo "- Open VSX: FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Fail if a store that was tried failed
        if: always() && (steps.vsce.outcome == 'failure' || steps.ovsx.outcome == 'failure')
        run: |
          echo "::error::a store rejected the extension; see the failed step above"
          exit 1
