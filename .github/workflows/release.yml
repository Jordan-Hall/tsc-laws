name: Release

# Builds and publishes the npm packages after every job of CI passes on the release commit's push to main.
# Push a version tag to release it, or dispatch from main with `release_tag` to retry without moving the tag.
# `node scripts/ci/ci-status.mjs latest-green` prints the latest commit that meets the CI gate.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish from a manual run
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci-green:
    name: CI is green on this commit
    runs-on: ubuntu-latest
    # A tag pushed right after a merge arrives while CI still runs on the commit; this waits up to 90 minutes for it.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare release notes
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - run: node scripts/ci/ci-status.mjs require-green "$(git rev-parse HEAD)" --wait 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  package:
    name: ${{ matrix.platform }}
    needs: ci-green
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.34 }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, docker: 'node:24-alpine' }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, target: x86_64-linux-gnu.2.34 }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, docker: 'node:24-alpine' }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        if: ${{ !matrix.docker }}
        with:
          node-version: 24
          cache: npm

      - uses: vercel-labs/setup-zig@v1
        if: ${{ matrix.platform == 'win32-x64-msvc' || matrix.target }}
        with:
          version: 0.16.0

      - name: Build and check
        if: ${{ !matrix.docker && !matrix.target }}
        run: |
          npm ci
          npm run pack:npm -w tsc-ts -- --check

      # The glibc executables link with zig against a glibc 2.34 sysroot, so they run on glibc 2.34 and newer
      # instead of requiring the runner's glibc. pack.mjs fails if one needs a newer glibc symbol version.
      - name: Build and check (glibc 2.34)
        if: ${{ matrix.target }}
        env:
          SCRIPTC_TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm run pack:npm -w tsc-ts -- --check

      # Actions can't run in Alpine containers on arm64, so musl builds run
      # in Docker directly.
      - name: Build and check (musl)
        if: ${{ matrix.docker }}
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ${{ matrix.docker }}
          sh -c 'apk add --no-cache clang lld musl-dev zig && npm ci && npm run pack:npm -w tsc-ts -- --check'

      - uses: actions/upload-artifact@v4
        with:
          name: tsc-ts-${{ matrix.platform }}
          path: packages/tsc-ts/dist/npm/tsc-ts-${{ matrix.platform }}-*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x64-gnu'
        with:
          name: tsc-ts
          path: packages/tsc-ts/dist/npm/tsc-ts-[0-9]*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [ci-green, package]
    if: >-
      github.repository == 'vercel-labs/tsc-ts' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && startsWith(inputs.release_tag, 'v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release version
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./packages/tsc-ts/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match packages/tsc-ts version $VERSION"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: tsc-ts*
          path: packages/tsc-ts/dist/npm
          merge-multiple: true

      # Configure npm trusted publishing for tsc-ts and all seven @tsc-ts
      # platform packages: owner vercel-labs, repository tsc-ts, workflow
      # release.yml, environment Release. This job uses GitHub OIDC and
      # --provenance; it needs no npm token secret. Node 24 supplies the npm
      # version required for trusted publishing.
      - name: Publish platform packages and launcher
        shell: bash
        run: |
          shopt -s nullglob
          # Platform names start with a letter; the launcher version starts with a digit.
          platform_packages=(packages/tsc-ts/dist/npm/tsc-ts-[a-z]*-*.tgz)
          launcher_packages=(packages/tsc-ts/dist/npm/tsc-ts-[0-9]*.tgz)
          if [ "${#platform_packages[@]}" -ne 7 ] || [ "${#launcher_packages[@]}" -ne 1 ]; then
            echo "Expected seven platform packages and one launcher package"
            ls -l packages/tsc-ts/dist/npm
            exit 1
          fi
          for package in "${platform_packages[@]}"; do
            npm publish "$package" --provenance --access public
          done
          npm publish "${launcher_packages[0]}" --provenance --access public

  github-release:
    name: Create GitHub Release
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Download published packages
        uses: actions/download-artifact@v4
        with:
          pattern: tsc-ts*
          path: ${{ runner.temp }}/npm
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/npm/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
